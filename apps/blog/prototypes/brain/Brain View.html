// Conceptual entry points mapped to map node IDs (RC-MAP seed). Not clinical localisation.

const key = new THREE.DirectionalLight(0xffffff, 1.2); key.position.set(-4, 5, 6); scene.add(key);
const fill = new THREE.DirectionalLight(0xd2cefd, 0.5); fill.position.set(-6, -2, -5); scene.add(fill);

    Object.assign(cfg.particles, { color: '#b5abfc', crownColor: '#5d5294', sizePx: 2.2, opacity: 1, crownMix: 0.7 });

    Object.assign(cfg.surface, { crown: '#3f424d', fundus: '#232532', sulcStrength: 1.1, roughness: 0.85 });
    Object.assign(cfg.particles, { color: '#796cbf', crownColor: '#d2cefd', sizePx: 2.2, opacity: 1, crownMix: 0.65 });
    Object.assign(cfg.lines, { color: '#423a6a', intensity: 0.5 });

}
const applyCfg = () => brain && brain.apply({ ...cfg, camera: { ...cfg.camera, distanceUnits: dist } }, { dpr: renderer.getPixelRatio() });
function rings() {

}
function anchorFrom(assets, dir) {

function frame() {

  const cands = FX.map((f, i) => i).filter((i) => markers[i].inside && markers[i].facing > M.enter && !st.shown.some((s) => s.i === i))

    m.mk.classList.toggle('hidden', !front);
    m.mk.style.transform = `translate(${m.sx.toFixed(1)}px, ${m.sy.toFixed(1)}px)`;
    m.mk.style.opacity = front ? Math.min(1, 0.35 + m.facing * 1.6).toFixed(2) : '0';

    const m = markers[i]; if (i !== st.sel && !(m.facing > M.leave && m.inside)) continue;

  pivot.add(ringGroup, brain.root);
  FX.forEach((f, i) => { const a = anchorFrom(assets, f.dir); markers[i].p = a.p; markers[i].n = a.n; });
  stage.prepend(renderer.domElement); $('loading').remove();
  applyTheme();
  new ResizeObserver(frame).observe(stage); frame();
  requestAnimationFrame(tick);
  post({ type: 'rc-brain-ready' });
} catch (err) {
  console.error(err);
  $('loading').textContent = 'A visualização 3D não está disponível neste navegador. As funções continuam acessíveis no mapa e na lista.';
}
</script>
</body>
</html>
